<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>คลังความรู้ความมั่นคงปลอดภัยไซเบอร์</title>
<meta name="description" content="เนื้อหาทบทวนความรู้ด้านความมั่นคงปลอดภัยไซเบอร์ พร้อมแบบฝึกหัดและแล็บ">

<!-- ติดตั้งเป็นแอปบนหน้าโฮมของมือถือ -->
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#0F2338">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="คลังไซเบอร์">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png">
<link rel="icon" type="image/svg+xml" href="/icon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=IBM+Plex+Sans+Thai:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/styles.css">

</head>
<body>

<a class="skip" href="#main">ข้ามไปยังเนื้อหา</a>

<header class="topbar">
  <button class="navtoggle" id="navToggle" aria-label="เปิดสารบัญ" aria-expanded="false">
    <span></span><span></span><span></span>
  </button>

  <a class="brand" href="#/">
    <svg viewBox="0 0 24 28" aria-hidden="true"><path d="M12 1 2 5v9c0 6.3 4.3 11.6 10 13 5.7-1.4 10-6.7 10-13V5L12 1Z"/><path class="tick" d="M7.5 14.2l3 3 6-6.6" fill="none"/></svg>
    <span>คลังความรู้<b>ไซเบอร์</b></span>
  </a>

  <div class="xpwrap" id="xpWrap" title="ความคืบหน้าของคุณ">
    <div class="xpring" id="xpRing"><span id="lvNum">1</span></div>
    <div class="xpmeta">
      <div class="xprank" id="rankName">ผู้เฝ้าระวังฝึกหัด</div>
      <div class="xpbar"><i id="xpFill"></i></div>
      <div class="xptext" id="xpText">0 EXP</div>
    </div>
  </div>

  <div class="acct" id="acct"></div>
</header>

<div class="shell">
  <aside class="sidebar" id="sidebar">
    <nav id="toc" aria-label="สารบัญเนื้อหา"></nav>
    <div class="sidefoot">
      <button class="linkbtn" id="btnExport">บันทึกความคืบหน้าเป็นไฟล์</button>
      <button class="linkbtn" id="btnImport">นำเข้าไฟล์ความคืบหน้า</button>
      <button class="linkbtn danger" id="btnReset">ล้างความคืบหน้าทั้งหมด</button>
      <input type="file" id="fileInput" accept="application/json" hidden>
    </div>
  </aside>

  <main id="main" tabindex="-1"></main>
</div>

<div class="scrim" id="scrim" hidden></div>

<div class="toaster" id="toaster" aria-live="polite"></div>

<script src="/app.js"></script>
</body>
</html>
